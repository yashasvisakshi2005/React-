<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1 class="logo">Activate Beast Mode</h1>
        <div class="right-nav">
            <div class="select-box">
                <div class="select-heading"><span>All  Workouts</span><img src="arrow.svg" alt=""></div>
                <div class="options">
                    <div class="option">All Workouts</div>
                    <div class="option">Back Workout</div>
                    <div class="option">Chest Workout</div>
                    <div class="option">Bicep & Tricep</div>
                    <div class="option">Shoulder</div>
                    <div class="option">Leg Workout</div>
                </div>
            </div>
            <img src="chatbot.svg" alt="image" id="main-chatbot-icon">
        </div>
    </nav>
    <main>
        <div class="chat-box">
             <div class="chat-container">
                <div class="user-chatbox">
                    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Perferendis, quibusdam.</p>
                </div>
                <div class="ai-chatbox">
                    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Sapiente, excepturi.</p>
                </div>
             </div>
             <div class="input-area">
                <input type="text" class="prompt" placeholder="Ask Anything...">
                <button><img src="btn.svg" alt=""></button>
             </div>
        </div>
    </main>
    <script src="script.js"> </script>
</body>
</html>
